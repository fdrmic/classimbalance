[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml_benchmark"
version = "0.1.0"
description = "AML Class Imbalance Benchmark – Bachelor Thesis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=12.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "imbalanced-learn>=0.11",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
