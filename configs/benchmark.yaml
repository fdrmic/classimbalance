# -------------------------------------------------------
# Part A benchmark grid configuration
# 5 strategies x 2 models x 3 prevalences = 30 runs
# -------------------------------------------------------

models:
  - random_forest
  - xgboost

strategies:
  - baseline
  - random_undersampling
  - smote
  - adasyn
  - class_weighting

# Target positive-class prevalence levels in the training split.
# Values are fractions (e.g. 0.01 = 1.0%).
# For baseline: training data is used unchanged at its natural prevalence.
# For RUS:           majority class is undersampled to reach this ratio.
# For SMOTE/ADASYN:  minority class is oversampled to reach this ratio.
# For class_weighting: ratio is used to derive model class weights only.
target_prevalences:
  - 0.010   # 1.0%
  - 0.005   # 0.5%
  - 0.001   # 0.1%
