# -------------------------------------------------------
# Part B — Multi-strategy threshold optimisation
#
# All three strategies operate on the SAME pre-computed
# probability scores from the Part A XGBoost Baseline model.
# No retraining occurs.  PR-AUC is therefore mathematically
# invariant across all three strategies (sanity-checked at
# runtime; mismatches > 1e-9 raise RuntimeError).
#
# Reference operating point for comparisons is the Part A
# F1-optimal threshold (NOT 0.5).
# -------------------------------------------------------

# Selected representative baseline run.  The Baseline strategy is
# invariant to target_prevalence (no resampling, no class weighting),
# so all three xgboost__baseline__pXXX runs produce bit-identical
# models — one is sufficient.
selected_run_id: xgboost__baseline__p001__20260404_143052

strategy_types:
  - precision_constrained
  - f1_max
  - f2_max

# Threshold grid construction.  Built from VALIDATION score quantiles
# only (anti-leakage).  The runtime selector never sees test scores.
threshold_grid:
  source: val_score_quantiles
  n_dense: 1000

# Parameters used by the precision_constrained strategy only.
precision_constrained:
  min_precision: 0.10
  lambda_fp: 0.05

# Reference operating point definition.  Loaded per-run from
# threshold_info.json (written by re_evaluate.py with criterion=f1).
part_a_reference:
  threshold_criterion: f1
  source_file: threshold_info.json
